version: "3.9"

services:
  backend:
    image: de-tools-backend:latest
    container_name: de-tools-backend
    env_file:
      - ./.backend.env
    ports:
      - "8567:8567"
    volumes:
      - /home/resources:/app/resources
    restart: unless-stopped

  frontend:
    image: de-tools-frontend:latest
    container_name: de-tools-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
